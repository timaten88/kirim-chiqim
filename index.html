<style>

<div id="l"><div></div></div>
<script>
// Login, parol va kirish kalitini shu sahifada ham saqlaydi (iPhone Safari ichki ramkani tozalab yuborsa ham yoʻqolmaydi)
(function () {
  var KEYS = ['kc_token', 'kc_user', 'kc_pass', 'kc_rem'];
  function okOrigin(o) { try { return /\.googleusercontent\.com$/.test(new URL(o).hostname); } catch (e) { return false; } }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || !m.kc || !okOrigin(e.origin)) return;
    try {
      if (m.kc === 'get') {
        var d = {};
        KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) d[k] = v; });
        e.source.postMessage({ kc: 'data', d: d }, e.origin);
      } else if (m.kc === 'set' && KEYS.indexOf(m.k) >= 0) {
        if (m.v == null) localStorage.removeItem(m.k); else localStorage.setItem(m.k, String(m.v));
      }
    } catch (x) {}
  });
})();
</script>
<script>
// Ilova shu sahifaning oʻzida ishga tushadi — login/parol shu sahifa xotirasida mustahkam saqlanadi
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzfmCqxU37_zw7h1Hdz7_9kjHVDKh0dS5Frflb356AYqtXQqX16iJ9d68xF2Q_C6xpa/exec';
  var icon = document.querySelector('link[rel="apple-touch-icon"]');
  var extra = '<script>window.KC_API=' + JSON.stringify(EXEC) + ';<\/script>' + (icon ? icon.outerHTML : '') +
    '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kirim-Chiqim">';
  function run(h) { h = h.replace(/<head>/i, '<head>' + extra); document.open(); document.write(h); document.close(); }
  function frame() {
    var f = document.createElement('iframe');
    f.title = 'Kirim-Chiqim'; f.src = EXEC;
    f.onload = function () { var l = document.getElementById('l'); if (l) l.remove(); };
    document.body.appendChild(f);
  }
  fetch(EXEC + '?raw=1', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (h) {
      if (h.indexOf('kc_token') < 0) throw 0;
      try { localStorage.setItem('kc_html', h); } catch (e) {}
      run(h);
    })
    .catch(function () {
      var c = null; try { c = localStorage.getItem('kc_html'); } catch (e) {}
      if (c) run(c); else frame();
    });
})();
</script>
